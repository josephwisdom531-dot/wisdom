<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <main class="app">
        <header class="app__header">
            <h1>Quiz JavaScript</h1>
            <p id="progress">Question 1 / 5</p>
        </header>
        <section id="start-screen">
            <form id="student-form">
                <input type="text" id="prenom" placeholder="Prénom">
                <input type="text" id="nom" placeholder="Nom">

                <p id="error"></p>

                <button type="submit">Commencer le quiz</button>
            </form>

            <P>Bienvenue au Quiz !</P>
        </section>

        <section id="quiz-screen">
            <h2 id="question">Que signifie HTML ?</h2>
            <ul id="answers">
                <li><button class="answer">HyperText Markup Language</button></li>
                <li><button class="answer">High Tech Modern Language</button></li>
                <li><button class="answer">HyperText Machine Language</button></li>
                <li><button class="answer">Home Tool Markup Language</button></li>
            </ul>
            <p id="feedback"></p>
            <button id="next-btn" hidden>Suivant</button>
        </section>

        <section id="result-screen" hidden>
            <h2>Résultat</h2>
            <p id="student-name"></p>
            <p id="score"></p>
            <p id="student-name"></p>
            <p id="score"></p>


            <button id="restart-btn">Rejouer</button>
        </section>
        <div id="quiz-screen">
  <p id="progress"></p>
  <h2 id="question"></h2>

  <ul id="answers"></ul>

  <p id="feedback" class="feedback"></p>

  <button id="next-btn" hidden>Suivant</button>
</div>

<div id="result-screen" hidden>
  <h1>🎉 Résultat du quiz</h1>

  <p id="student-name"></p>
  <p id="score"></p>

  <button id="restart-btn">Recommencer</button>
</div>

    </main>


</body>

</html>
